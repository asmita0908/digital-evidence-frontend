<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Evidence Protection System</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="site-header">
    <div class="brand">
      <div class="brand-icon">🔐</div>

      <div>
        <h1>Digital Evidence Protection System</h1>
        <p>Secure • Manage • Protect Digital Evidence</p>
      </div>
    </div>
  </header>


  <!-- ================= LOGIN CARD ================= -->
  <main class="login-container">

    <div class="card">

      <h2>Login</h2>

      <p class="login-subtitle">
        Sign in to access your secure evidence management system
      </p>

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
      >

      <button onclick="loginUser()">Login</button>

      <p class="account-text">
        New user?
        <a href="register.html">Create account</a>
      </p>

      <p class="forgot-link">
        <a href="#" onclick="showForgot(); return false;">
          Forgot Password?
        </a>
      </p>


      <!-- ================= FORGOT PASSWORD ================= -->
      <div id="forgotBox" class="forgot-box" style="display:none;">

        <h3>Reset Password</h3>

        <input
          type="email"
          id="fEmail"
          placeholder="Enter your registered email"
        >

        <div class="otp-buttons">
          <button type="button" onclick="sendOTP()">Send OTP</button>
          <button type="button" onclick="sendOTP()">Resend OTP</button>
        </div>

        <p id="timerText"></p>

        <input
          type="text"
          id="otp"
          placeholder="Enter OTP"
        >

        <button type="button" onclick="verifyOTP()">
          Verify OTP
        </button>

        <input
          type="password"
          id="newPassword"
          placeholder="Enter new password"
        >

        <button type="button" onclick="resetPassword()">
          Reset Password
        </button>

      </div>

    </div>

  </main>


  <!-- ================= FOOTER ================= -->
  <footer class="site-footer">
    <p>© 2026 Digital Evidence Protection System</p>
    <span>Secure Digital Evidence Management</span>
  </footer>


  <script src="js/auth.js"></script>

</body>
</html>
